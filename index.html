<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pendientes</title>
  <meta name="description" content="Una lista de tareas simple que se guarda en tu navegador. Sin cuenta.">
  <meta name="theme-color" content="#2f5a48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fuentes/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/barlow-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css?v=6">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-fecha" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/></g><circle cx="8.5" cy="14.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-borrar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7M10.2 11v5.5M13.8 11v5.5"/></g></symbol>
    <symbol id="i-asa" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6.5" r="1.6"/><circle cx="15" cy="6.5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="17.5" r="1.6"/><circle cx="15" cy="17.5" r="1.6"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-cuenta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20c1.2-3.6 4-5.4 7.2-5.4s6 1.8 7.2 5.4"/></g></symbol>
    <symbol id="i-nube" viewBox="0 0 24 24"><path d="M7.2 18.5h10a3.8 3.8 0 0 0 .5-7.6 5.6 5.6 0 0 0-10.8 1.4A3.1 3.1 0 0 0 7.2 18.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-salir" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7"/><path d="M11 12h9M16.5 8.5 20 12l-3.5 3.5"/></g></symbol>
    <symbol id="i-escoba" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 4.5l-7 7"/><path d="M11 10.5l3 3-1.6 6.2c-.2.7-1 1-1.6.6L4.6 15.2c-.6-.4-.6-1.2-.1-1.7z"/><path d="M8.4 17.8l2-2.6M6.2 15.9l2.1-2.4"/></g></symbol>
  </svg>

  <header class="banda">
    <div class="banda-in">
      <div class="arriba">
        <div class="cabeza">
          <h1>Pendientes</h1>
          <p class="cuenta" id="cuenta" aria-live="polite"></p>
          <p class="sync" id="sync" hidden><svg class="ic"><use href="#i-nube"/></svg><span id="sync-t"></span></p>
        </div>
        <div class="acceso" id="acceso" hidden>
          <button type="button" class="entrar" id="entrar" aria-label="Entrar con Google"><svg class="ic"><use href="#i-cuenta"/></svg><span>Entrar con Google</span></button>
          <button type="button" class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false" aria-controls="menu-cuenta" hidden><span id="avatar-ini"></span></button>
          <div class="menu-cuenta" id="menu-cuenta" role="dialog" aria-label="Tu cuenta" hidden>
            <button type="button" class="x-redonda chica cerrar-menu" id="cerrar-menu" aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button>
            <p class="mc-nombre" id="mc-nombre"></p>
            <p class="mc-correo" id="mc-correo"></p>
            <p class="mc-nota">Tu lista se guarda en la cuenta de Taller y se ve igual en tus otros equipos.</p>
            <button type="button" class="mc-salir" id="salir"><svg class="ic"><use href="#i-salir"/></svg><span>Salir</span></button>
          </div>
        </div>
      </div>
      <form class="agregar" id="agregar" autocomplete="off">
        <label class="sr" for="nueva">Nueva tarea</label>
        <div class="campo">
          <input id="nueva" name="texto" type="text" maxlength="200" placeholder="Agregar una tarea" enterkeyhint="done">
          <span class="pick" id="pick-wrap">
            <button type="button" class="ico-btn" id="btn-fecha" aria-label="Poner fecha límite" title="Fecha límite"><svg class="ic"><use href="#i-fecha"/></svg></button>
            <input type="date" id="nueva-fecha" tabindex="-1" aria-label="Fecha límite de la nueva tarea">
          </span>
        </div>
        <button type="submit" class="btn-agregar" aria-label="Agregar tarea"><svg class="ic"><use href="#i-mas"/></svg></button>
      </form>
      <p class="fecha-elegida" id="fecha-elegida" hidden>
        <span id="fecha-elegida-txt"></span>
        <button type="button" class="x-redonda chica" id="quitar-fecha" aria-label="Quitar la fecha"><svg class="ic"><use href="#i-x"/></svg></button>
      </p>
    </div>
  </header>

  <main class="tablero">
    <div class="barra">
      <div class="filtros" role="tablist" aria-label="Mostrar">
        <button role="tab" class="filtro" data-f="todas">Todas <span class="n" data-n="todas"></span></button>
        <button role="tab" class="filtro" data-f="pendientes">Pendientes <span class="n" data-n="pendientes"></span></button>
        <button role="tab" class="filtro" data-f="hechas">Hechas <span class="n" data-n="hechas"></span></button>
      </div>
    </div>

    <ul class="lista" id="lista" aria-label="Tareas"></ul>
    <div class="pie">
        <button type="button" class="limpiar" id="limpiar" hidden><svg class="ic"><use href="#i-escoba"/></svg><span>Quitar hechas</span></button>
    </div>

    <div class="vacio" id="vacio" hidden>
      <svg class="vacio-art" viewBox="0 0 160 96" aria-hidden="true">
        <g fill="currentColor" opacity=".22"><circle cx="16" cy="16" r="3"/><circle cx="48" cy="16" r="3"/><circle cx="80" cy="16" r="3"/><circle cx="112" cy="16" r="3"/><circle cx="144" cy="16" r="3"/><circle cx="16" cy="48" r="3"/><circle cx="144" cy="48" r="3"/><circle cx="16" cy="80" r="3"/><circle cx="48" cy="80" r="3"/><circle cx="80" cy="80" r="3"/><circle cx="112" cy="80" r="3"/><circle cx="144" cy="80" r="3"/></g>
        <path class="silueta" d="M54 30h46a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H54l-9-5v-8z M73 48h10v28a5 5 0 0 1-10 0z" fill="none" stroke-width="2.4" stroke-dasharray="5 4" stroke-linejoin="round"/>
      </svg>
      <p class="vacio-t" id="vacio-t"></p>
      <p class="vacio-s" id="vacio-s"></p>
    </div>

    <p class="aviso-guardado" id="aviso-guardado" hidden>Este navegador no deja guardar: la lista se perderá al cerrar la pestaña.</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-t" id="toast-t"></span>
    <button type="button" class="toast-btn" id="toast-deshacer">Deshacer</button>
    <button type="button" class="x-redonda" id="toast-cerrar" aria-label="Cerrar aviso"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>

  <template id="t-fila">
    <li class="fila">
      <button type="button" class="ranura" role="checkbox" aria-checked="false">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect class="r-borde" x="2" y="2" width="24" height="24" rx="7"/><rect class="r-relleno" x="2" y="2" width="24" height="24" rx="7"/><path class="r-check" d="M8 14.5l4 4 8.5-9"/></svg>
      </button>
      <div class="cuerpo">
        <button type="button" class="texto"></button>
        <span class="vence"></span>
      </div>
      <button type="button" class="asa" aria-label="Mover"><svg class="ic"><use href="#i-asa"/></svg></button>
    </li>
  </template>

  <template id="t-editor">
    <form class="editor" autocomplete="off">
      <label class="sr">Texto de la tarea</label>
      <input class="ed-texto" type="text" maxlength="200" enterkeyhint="done">
      <div class="ed-fila">
        <label class="ed-fecha"><svg class="ic"><use href="#i-fecha"/></svg><input class="ed-fecha-in" type="date" aria-label="Fecha límite"></label>
        <button type="button" class="ed-sin-fecha">Sin fecha</button>
        <span class="ed-acciones">
          <button type="button" class="ed-borrar" aria-label="Borrar tarea"><svg class="ic"><use href="#i-borrar"/></svg><span>Borrar</span></button>
          <button type="submit" class="ed-listo">Listo</button>
        </span>
      </div>
    </form>
  </template>

  <script src="firebase-config.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
